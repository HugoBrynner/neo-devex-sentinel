[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-devex-sentinel"
version = "0.1.0"
description = "Local compatibility and documentation-drift checker for Neo developer tooling"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "HugoBrynner" }]
keywords = ["neo", "blockchain", "developer-tools", "compatibility", "documentation", "devex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
neo-sentinel = "neo_sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["neo_sentinel*"]

[tool.pytest.ini_options]
pythonpath = ["."]
